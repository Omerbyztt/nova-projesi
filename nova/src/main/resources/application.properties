# MySQL Veritabanı Bağlantı Ayarları
spring.datasource.url=jdbc:mysql://localhost:3306/nova_yazilim?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=5510
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Ayarları
# update: Uygulama başladığında entity sınıflarına göre veritabanı tablolarını günceller/oluşturur.
spring.jpa.hibernate.ddl-auto=update

# Çalıştırılan SQL sorgularını konsolda göstermek için (Geliştirme aşamasında faydalıdır)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dosya Yükleme Sınırları (413 Payload Too Large Hatası İçin)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=always
server.error.include-stacktrace=always
